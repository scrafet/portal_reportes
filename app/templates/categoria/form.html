{% extends 'base.html' %}

{% block page_title %}{{ action }} Categoría{% endblock %}
{% block breadcrumb %}{{ action }} Categoría{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card card-info">
            <div class="card-header">
                <h3 class="card-title">Datos</h3>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="card-body">
                    <div class="form-group mb-3">
                        <label>Nombre</label>
                        <input type="text" class="form-control" name="nombre" value="{{ categoria.nombre|default:'' }}"
                            required>
                    </div>
                    <div class="form-group mb-3">
                        <label>Icono (FontAwesome)</label>
                        <input type="text" class="form-control" name="icono"
                            value="{{ categoria.icono|default:'fas fa-folder' }}" required>
                    </div>
                    <div class="form-group mb-3">
                        <label>Orden</label>
                        <input type="number" class="form-control" name="orden" value="{{ categoria.orden|default:0 }}"
                            required>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" name="activo" id="activo" {% if not categoria or
                            categoria.activo %}checked{% endif %}>
                        <label class="form-check-label" for="activo">Activo</label>
                    </div>
                </div>
                <div class="card-footer">
                    <button class="btn btn-info">Guardar</button>
                    <a href="{% url 'categoria_list' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
