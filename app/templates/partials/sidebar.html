<aside class="main-sidebar sidebar-dark-primary elevation-4">
    <!-- Brand Logo -->
    <a href="/" class="brand-link">
        <img src="https://adminlte.io/themes/v3/dist/img/AdminLTELogo.png" alt="AdminLTE Logo"
            class="brand-image img-circle elevation-3" style="opacity: .8">
        <span class="brand-text font-weight-light">Portal Reportes</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Sidebar user panel (optional) -->
        <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="image">
                <img src="https://adminlte.io/themes/v3/dist/img/user2-160x160.jpg" class="img-circle elevation-2"
                    alt="User Image">
            </div>
            <div class="info">
                <a href="#" class="d-block">{{ user.username|default:"Usuario" }}</a>
            </div>
        </div>

        <!-- SidebarSearch Form -->
        <div class="form-inline">
            <div class="input-group" data-widget="sidebar-search">
                <input class="form-control form-control-sidebar" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-sidebar">
                    <i class="fas fa-search fa-fw"></i>
                </button>
            </div>
        </div>

        <!-- Sidebar Menu -->
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                <li class="nav-header">REPORTES</li>

                {% for categoria in sidebar_categories %}
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="nav-icon fas fa-folder"></i>
                        <p>
                            {{ categoria.nombre }}
                            <i class="fas fa-angle-left right"></i>
                        </p>
                    </a>
                </li>
                {% empty %}
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="nav-icon fas fa-exclamation-circle"></i>
                        <p>Sin Categorías</p>
                    </a>
                </li>
                {% endfor %}

                <li class="nav-header">SISTEMA</li>
                <li class="nav-item">
                    <a href="{% url 'reporte_list' %}"
                        class="nav-link {% if 'reportes/' in request.path %}active{% endif %}">
                        <i class="nav-icon fas fa-file-alt"></i>
                        <p>Gestión Reportes</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'categoria_list' %}"
                        class="nav-link {% if 'categorias/' in request.path %}active{% endif %}">
                        <i class="nav-icon fas fa-folder-open"></i>
                        <p>Categorías (Menús)</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'usuario_list' %}"
                        class="nav-link {% if 'usuarios/' in request.path %}active{% endif %}">
                        <i class="nav-icon fas fa-users"></i>
                        <p>Usuarios</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/" class="nav-link">
                        <i class="nav-icon fas fa-cogs"></i>
                        <p>Panel Admin</p>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- /.sidebar-menu -->
    </div>
    <!-- /.sidebar -->
</aside>
